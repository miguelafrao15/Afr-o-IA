<!DOCTYPE html>
<html lang="pt-BR" class="h-full font-sans antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Afrão IA - Minimalist Assistant</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ios: {
                            blue: '#007AFF',
                            green: '#34C759',
                            bg: '#F2F2F7',
                            card: '#FFFFFF',
                            darkBg: '#000000',
                            darkCard: '#1C1C1E',
                            gray: '#8E8E93',
                            border: 'rgba(60, 60, 67, 0.12)',
                            darkBorder: 'rgba(235, 235, 245, 0.15)'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome & Marked Parser -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* Custom Scrollbar for Smooth iOS feel */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(142, 142, 147, 0.3); border-radius: 99px; }
        
        /* Glassmorphism & Micro Animations */
        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .dark .glass {
            background: rgba(28, 28, 30, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        /* Typography overrides for prose markdown */
        .prose p { margin-bottom: 0.5rem; }
        .prose p:last-child { margin-bottom: 0; }
        .prose code { background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 6px; font-size: 0.85em; }
        .dark .prose code { background: rgba(255,255,255,0.1); }
        .prose pre { background: #18181b; color: #f4f4f5; padding: 12px; border-radius: 12px; overflow-x: auto; font-size: 0.85rem; margin: 8px 0; }
    </style>
</head>
<body class="h-full bg-ios-bg dark:bg-ios-darkBg text-slate-900 dark:text-slate-100 flex flex-col transition-colors duration-300 select-none overflow-hidden">

    <!-- App Container -->
    <div class="relative flex h-full w-full max-w-5xl mx-auto overflow-hidden md:py-4 md:px-4">
        
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="fixed md:relative inset-y-0 left-0 z-40 w-72 bg-white/90 dark:bg-ios-darkCard/90 border-r border-ios-border dark:border-ios-darkBorder flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out md:rounded-3xl md:border shadow-2xl md:shadow-none my-0 md:mr-3">
            
            <!-- Sidebar Header -->
            <div class="p-4 flex items-center justify-between border-b border-ios-border dark:border-ios-darkBorder">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-ios-blue to-cyan-400 flex items-center justify-center text-white font-bold text-xs shadow-md">
                        A
                    </div>
                    <span class="font-semibold text-sm tracking-tight">Afrão IA</span>
                </div>
                <button onclick="createNewChat()" class="w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800/60 flex items-center justify-center text-ios-blue transition-colors">
                    <i class="fa-solid fa-pen-to-square text-base"></i>
                </button>
            </div>

            <!-- Chat History List -->
            <div class="flex-1 overflow-y-auto p-2 space-y-1" id="chat-list">
                <!-- Chat Items Inject Dynamic Here -->
            </div>

            <!-- Sidebar Footer / Settings -->
            <div class="p-3 border-t border-ios-border dark:border-ios-darkBorder flex items-center justify-between bg-slate-50/50 dark:bg-slate-900/30">
                <button onclick="toggleTheme()" class="flex items-center gap-2 text-xs font-medium text-ios-gray hover:text-slate-900 dark:hover:text-white transition-colors px-2 py-1.5 rounded-xl">
                    <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
                    <span id="theme-text">Modo Escuro</span>
                </button>
                <button onclick="openSettings()" class="w-8 h-8 rounded-full hover:bg-slate-200/50 dark:hover:bg-slate-800 flex items-center justify-center text-ios-gray hover:text-slate-900 dark:hover:text-white transition-colors">
                    <i class="fa-solid fa-gear text-sm"></i>
                </button>
            </div>
        </aside>

        <!-- Sidebar Backdrop for Mobile -->
        <div id="sidebar-overlay" onclick="toggleSidebar(false)" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-30 hidden md:hidden"></div>

        <!-- Main Workspace -->
        <main class="flex-1 flex flex-col h-full bg-white dark:bg-ios-darkCard md:rounded-3xl border-0 md:border border-ios-border dark:border-ios-darkBorder overflow-hidden shadow-sm">
            
            <!-- Top Navbar -->
            <header class="h-14 glass border-b border-ios-border dark:border-ios-darkBorder px-4 flex items-center justify-between shrink-0 z-10">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar(true)" class="md:hidden w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center text-ios-blue">
                        <i class="fa-solid fa-bars text-base"></i>
                    </button>
                    <div>
                        <h1 id="current-chat-title" class="text-xs font-semibold text-slate-800 dark:text-slate-100 tracking-tight leading-none">Nova Conversa</h1>
                        <span class="text-[10px] text-ios-gray font-medium">Afrão IA • iOS Style</span>
                    </div>
                </div>
                <button onclick="clearCurrentChat()" class="text-xs font-medium text-rose-500 hover:text-rose-600 transition-colors px-2 py-1 rounded-lg">
                    Limpar
                </button>
            </header>

            <!-- Chat Messages Log -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4">
                
                <!-- Welcome Empty State -->
                <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center p-6 space-y-4 max-w-sm mx-auto">
                    <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-ios-blue to-indigo-500 flex items-center justify-center text-white text-2xl shadow-xl shadow-ios-blue/20">
                        <i class="fa-solid fa-sparkles"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold tracking-tight">Como posso ajudar hoje?</h2>
                        <p class="text-xs text-ios-gray mt-1">Sou o Afrão IA, pronto para responder perguntas, criar textos ou programar.</p>
                    </div>
                    <div class="grid grid-cols-1 w-full gap-2 pt-2">
                        <button onclick="usePrompt('Crie um resumo sobre inteligência artificial')" class="p-3 text-left bg-slate-50 dark:bg-slate-800/50 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-2xl text-xs transition-colors border border-slate-200/50 dark:border-slate-700/50">
                            💡 Crie um resumo sobre Inteligência Artificial
                        </button>
                        <button onclick="usePrompt('Escreva uma poesia minimalista')" class="p-3 text-left bg-slate-50 dark:bg-slate-800/50 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-2xl text-xs transition-colors border border-slate-200/50 dark:border-slate-700/50">
                            ✍️ Escreva um poema curto
                        </button>
                    </div>
                </div>

            </div>

            <!-- Input Bar -->
            <footer class="p-3 glass border-t border-ios-border dark:border-ios-darkBorder shrink-0">
                <form id="chat-form" onsubmit="handleSend(event)" class="flex items-end gap-2 bg-slate-100 dark:bg-slate-800/60 rounded-3xl p-1.5 border border-slate-200/60 dark:border-slate-700/60 focus-within:ring-2 focus-within:ring-ios-blue/40 transition-all">
                    <textarea 
                        id="user-input" 
                        rows="1" 
                        placeholder="Digite sua mensagem..." 
                        onkeydown="handleKeyDown(event)"
                        oninput="autoResizeTextarea(this)"
                        class="flex-1 bg-transparent border-0 focus:ring-0 resize-none max-h-28 px-3 py-1.5 text-xs text-slate-800 dark:text-slate-100 placeholder-ios-gray outline-none"
                    ></textarea>
                    <button type="submit" id="send-btn" class="w-8 h-8 rounded-full bg-ios-blue hover:bg-blue-600 disabled:opacity-40 text-white flex items-center justify-center transition-all shadow-md shrink-0">
                        <i class="fa-solid fa-arrow-up text-sm"></i>
                    </button>
                </form>
            </footer>

        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm hidden">
        <div class="modal-container bg-white dark:bg-ios-darkCard w-full max-w-sm rounded-3xl p-5 border border-ios-border dark:border-ios-darkBorder shadow-2xl transition-all transform scale-95 opacity-0 space-y-4">
            
            <div class="flex items-center justify-between border-b border-ios-border dark:border-ios-darkBorder pb-3">
                <h3 class="font-semibold text-sm">Configurações</h3>
                <button onclick="closeSettings()" class="text-ios-gray hover:text-slate-900 dark:hover:text-white">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="text-[10px] font-bold text-ios-gray uppercase tracking-wider block mb-1">Chave de API Groq</label>
                    <input type="password" id="groq-key-input" placeholder="gsk_..." class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs focus:ring-1 focus:ring-ios-blue outline-none font-mono">
                </div>

                <div>
                    <label class="text-[10px] font-bold text-ios-gray uppercase tracking-wider block mb-1">Modelo Groq</label>
                    <select id="groq-model-input" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs focus:ring-1 focus:ring-ios-blue outline-none font-medium">
                        <option value="qwen/qwen3.8-27b" selected>Qwen 3.8 27B (Recomendado)</option>
                        <option value="openai/gpt-oss-120b">GPT OSS 120B</option>
                        <option value="openai/gpt-oss-20b">GPT OSS 20B</option>
                        <option value="allam-2-7b">Allam 2 7B</option>
                    </select>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-ios-gray uppercase tracking-wider block mb-1">Instrução do Sistema (Persona)</label>
                    <textarea id="system-prompt-input" rows="3" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs focus:ring-1 focus:ring-ios-blue outline-none resize-none"></textarea>
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="saveSettings()" class="flex-1 bg-ios-blue text-white text-xs font-medium py-2.5 rounded-xl shadow-md hover:bg-blue-600 transition-colors">
                    Salvar
                </button>
            </div>

        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        // State Management
        let chats = JSON.parse(localStorage.getItem('afrao_chats')) || [];
        let activeChatId = localStorage.getItem('afrao_active_chat') || null;
        let systemPrompt = localStorage.getItem('afrao_system_prompt') || "Você é o Afrão IA, um assistente amigável, conciso e educado no estilo iOS da Apple. Responda em Português do Brasil.";
        let groqApiKey = localStorage.getItem('afrao_groq_key') || "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";
        let currentModel = localStorage.getItem('afrao_model') || "qwen/qwen3.8-27b";

        // Elements
        const chatListEl = document.getElementById('chat-list');
        const messagesContainer = document.getElementById('messages-container');
        const emptyState = document.getElementById('empty-state');
        const currentChatTitleEl = document.getElementById('current-chat-title');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const settingsModal = document.getElementById('settings-modal');
        const systemPromptInput = document.getElementById('system-prompt-input');
        const groqKeyInput = document.getElementById('groq-key-input');
        const modelInput = document.getElementById('groq-model-input');

        // Initial Boot
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            if (chats.length === 0) {
                createNewChat("Nova Conversa", false);
            } else {
                if (!activeChatId || !chats.find(c => c.id === activeChatId)) {
                    activeChatId = chats[0].id;
                }
                renderChatList();
                renderMessages();
            }
            if (systemPromptInput) systemPromptInput.value = systemPrompt;
            if (groqKeyInput) groqKeyInput.value = groqApiKey;
            if (modelInput) modelInput.value = currentModel;
        });

        // Theme Switcher
        function initTheme() {
            const isDark = localStorage.getItem('afrao_theme') === 'dark' || 
                (!('afrao_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            
            if (isDark) {
                document.documentElement.classList.add('dark');
                updateThemeUI(true);
            } else {
                document.documentElement.classList.remove('dark');
                updateThemeUI(false);
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('afrao_theme', isDark ? 'dark' : 'light');
            updateThemeUI(isDark);
        }

        function updateThemeUI(isDark) {
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');
            if (isDark) {
                themeIcon.className = 'fa-solid fa-sun text-sm text-amber-400';
                themeText.textContent = 'Modo Claro';
            } else {
                themeIcon.className = 'fa-solid fa-moon text-sm text-slate-600';
                themeText.textContent = 'Modo Escuro';
            }
        }

        // Chat List & Management
        function saveChats() {
            localStorage.setItem('afrao_chats', JSON.stringify(chats));
            localStorage.setItem('afrao_active_chat', activeChatId);
        }

        function createNewChat(title = "Nova Conversa", switchChat = true) {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: title,
                messages: []
            };
            chats.unshift(newChat);
            if (switchChat) {
                activeChatId = newChat.id;
            }
            saveChats();
            renderChatList();
            renderMessages();
            toggleSidebar(false);
        }

        function switchChat(id) {
            activeChatId = id;
            saveChats();
            renderChatList();
            renderMessages();
            toggleSidebar(false);
        }

        function renameChat(id, e) {
            e.stopPropagation();
            const chat = chats.find(c => c.id === id);
            if (!chat) return;
            const newTitle = prompt("Renomear conversa:", chat.title);
            if (newTitle && newTitle.trim()) {
                chat.title = newTitle.trim();
                saveChats();
                renderChatList();
                if (activeChatId === id) {
                    currentChatTitleEl.textContent = chat.title;
                }
            }
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            if (chats.length <= 1) {
                alert("Você deve manter pelo menos uma conversa ativa.");
                return;
            }
            chats = chats.filter(c => c.id !== id);
            if (activeChatId === id) {
                activeChatId = chats[0].id;
            }
            saveChats();
            renderChatList();
            renderMessages();
        }

        function clearCurrentChat() {
            const chat = chats.find(c => c.id === activeChatId);
            if (chat) {
                chat.messages = [];
                saveChats();
                renderMessages();
            }
        }

        function renderChatList() {
            chatListEl.innerHTML = '';
            chats.forEach(chat => {
                const isActive = chat.id === activeChatId;
                const item = document.createElement('div');
                item.className = `group flex items-center justify-between p-2.5 rounded-2xl cursor-pointer text-xs transition-all ${
                    isActive 
                    ? 'bg-ios-blue text-white font-medium shadow-sm' 
                    : 'text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/60'
                }`;
                item.onclick = () => switchChat(chat.id);

                item.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden">
                        <i class="fa-regular fa-message ${isActive ? 'text-white' : 'text-ios-gray'}"></i>
                        <span class="truncate">${escapeHtml(chat.title)}</span>
                    </div>
                    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="renameChat('${chat.id}', event)" class="p-1 hover:text-amber-300">
                            <i class="fa-solid fa-pen text-[10px]"></i>
                        </button>
                        <button onclick="deleteChat('${chat.id}', event)" class="p-1 hover:text-rose-300">
                            <i class="fa-solid fa-trash text-[10px]"></i>
                        </button>
                    </div>
                `;
                chatListEl.appendChild(item);
            });
        }

        function renderMessages() {
            const chat = chats.find(c => c.id === activeChatId);
            messagesContainer.innerHTML = '';

            if (!chat || chat.messages.length === 0) {
                messagesContainer.appendChild(emptyState);
                emptyState.classList.remove('hidden');
                currentChatTitleEl.textContent = chat ? chat.title : "Nova Conversa";
                return;
            }

            emptyState.classList.add('hidden');
            currentChatTitleEl.textContent = chat.title;

            chat.messages.forEach(msg => {
                appendMessageToDOM(msg.role, msg.content);
            });
            scrollToBottom();
        }

        function appendMessageToDOM(role, content) {
            emptyState.classList.add('hidden');
            const wrapper = document.createElement('div');
            const isUser = role === 'user';

            wrapper.className = `flex ${isUser ? 'justify-end' : 'justify-start'} mb-3`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[85%] rounded-3xl px-4 py-2.5 text-xs shadow-xs transition-all ${
                isUser 
                ? 'bg-ios-blue text-white rounded-br-md font-normal' 
                : 'bg-slate-100 dark:bg-slate-800/80 text-slate-800 dark:text-slate-100 rounded-bl-md border border-slate-200/50 dark:border-slate-700/50'
            }`;

            if (isUser) {
                bubble.textContent = content;
            } else {
                const prose = document.createElement('div');
                prose.className = 'prose prose-slate dark:prose-invert max-w-none';
                prose.innerHTML = marked.parse(content);
                bubble.appendChild(prose);
            }

            wrapper.appendChild(bubble);
            messagesContainer.appendChild(wrapper);
            scrollToBottom();
            return wrapper;
        }

        // Messaging Logic & Groq API
        async function handleSend(e) {
            if (e) e.preventDefault();

            const text = userInput.value.trim();
            if (!text) return;

            const chat = chats.find(c => c.id === activeChatId);
            if (!chat) return;

            if (chat.messages.length === 0 && chat.title === "Nova Conversa") {
                chat.title = text.length > 20 ? text.substring(0, 20) + "..." : text;
                renderChatList();
            }

            chat.messages.push({ role: 'user', content: text });
            appendMessageToDOM('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            const assistantWrapper = appendMessageToDOM('assistant', '<i class="fa-solid fa-circle-notch fa-spin text-ios-gray"></i> Afrão está pensando...');
            const bubbleEl = assistantWrapper.querySelector('.prose') || assistantWrapper.querySelector('div');

            try {
                const apiMessages = [
                    { role: 'system', content: systemPrompt },
                    ...chat.messages.map(m => ({
                        role: m.role === 'user' ? 'user' : 'assistant',
                        content: m.content
                    }))
                ];

                const payload = {
                    model: currentModel,
                    messages: apiMessages,
                    temperature: 0.7,
                    max_tokens: 2048
                };

                const activeKey = groqKeyInput?.value.trim() || groqApiKey;
                const groqUrl = "https://api.groq.com/openai/v1/chat/completions";
                // Usamos o proxy corsproxy.io se a chamada direta for bloqueada
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(groqUrl)}`;

                let response;
                try {
                    // Tentativa 1: Chamada Direta
                    response = await fetch(groqUrl, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${activeKey}`
                        },
                        body: JSON.stringify(payload)
                    });
                } catch (directErr) {
                    console.warn("Chamada direta bloqueada por CORS. Tentando via Proxy...", directErr);
                    // Tentativa 2: Fallback via Proxy para contornar bloqueio de CORS no navegador
                    response = await fetch(proxyUrl, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${activeKey}`
                        },
                        body: JSON.stringify(payload)
                    });
                }

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `Erro HTTP ${response.status}`);
                }

                const data = await response.json();
                const aiText = data.choices?.[0]?.message?.content;
                
                if (aiText) {
                    chat.messages[chat.messages.length] = { role: 'assistant', content: aiText };
                    bubbleEl.innerHTML = marked.parse(aiText);
                } else {
                    throw new Error("Resposta em branco do servidor.");
                }

            } catch (err) {
                console.error("Erro na Requisição:", err);
                let errorMsg = `Erro na API: ${err.message}`;
                bubbleEl.innerHTML = `<span class="text-rose-500 font-medium">${escapeHtml(errorMsg)}</span>`;
            } finally {
                sendBtn.disabled = false;
                saveChats();
                scrollToBottom();
            }
        }

        // Helpers & Handlers
        function usePrompt(text) {
            userInput.value = text;
            handleSend();
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        }

        function autoResizeTextarea(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function toggleSidebar(show) {
            if (show === undefined) {
                sidebar.classList.toggle('-translate-x-full');
                sidebarOverlay.classList.toggle('hidden');
            } else if (show) {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            }
        }

        function openSettings() {
            settingsModal.classList.remove('hidden');
            setTimeout(() => {
                settingsModal.querySelector('.modal-container').classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeSettings() {
            const container = settingsModal.querySelector('.modal-container');
            container.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                settingsModal.classList.add('hidden');
            }, 200);
        }

        function saveSettings() {
            systemPrompt = systemPromptInput.value.trim() || "Você é o Afrão IA, um assistente inteligente.";
            groqApiKey = groqKeyInput.value.trim() || groqApiKey;
            currentModel = modelInput.value;

            localStorage.setItem('afrao_system_prompt', systemPrompt);
            localStorage.setItem('afrao_groq_key', groqApiKey);
            localStorage.setItem('afrao_model', currentModel);
            closeSettings();
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
